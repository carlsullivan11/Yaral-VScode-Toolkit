name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Lint example rules
        run: node dist/cli.js examples/rules --format github --max-warnings 0
      - name: Check example rule formatting
        run: node dist/cli.js format --check examples/rules

  package:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vsce package --no-dependencies -o yaral-toolkit.vsix
      - uses: actions/upload-artifact@v4
        with:
          name: yaral-toolkit-vsix
          path: yaral-toolkit.vsix

  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run the composite action against the examples
        uses: ./
        with:
          paths: examples/rules
          max-warnings: "0"
          format-check: "true"
